<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Belvo Synapse</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#0c0c0d;--paper:#f3f0ea;--accent:#ff5a2c;--muted:#a8a59d;--line:rgba(255,255,255,.16)}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--ink);color:var(--paper);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
    .box{width:100%;max-width:440px}
    .brand{font-family:'Inter Tight','Inter',sans-serif;font-weight:700;font-size:56px;letter-spacing:-.06em;line-height:1}
    .brand sup{font-size:.28em;font-weight:500;vertical-align:top;position:relative;top:.2em}
    .eyebrow{display:flex;align-items:center;gap:10px;margin:28px 0 8px;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
    .eyebrow::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent)}
    h1{font-family:'Inter Tight','Inter',sans-serif;font-size:40px;letter-spacing:-.04em;line-height:1;margin:0 0 10px;font-weight:600}
    p.sub{margin:0 0 30px;color:var(--muted);font-size:14px}
    .err{margin-bottom:18px;padding:12px 16px;border:1px solid var(--accent);border-radius:14px;color:var(--accent);font-size:13px;font-weight:600}
    label{display:block;margin-bottom:8px;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
    input{width:100%;padding:15px 18px;margin-bottom:20px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--paper);font:inherit;font-size:15px;outline:none;transition:border-color .2s}
    input:focus{border-color:var(--accent)}
    button{width:100%;padding:16px;border:0;border-radius:999px;background:var(--accent);color:var(--ink);font:600 15px 'Inter',sans-serif;cursor:pointer;transition:transform .2s}
    button:hover{transform:translateY(-2px)}
    .back{display:inline-block;margin-top:26px;color:var(--muted);font-size:13px;text-decoration:none}
    .back:hover{color:var(--paper)}
  </style>
</head>
<body>
  <div class="box">
    <div class="brand">belvo<sup>®</sup></div>
    <div class="eyebrow">Synapse Control</div>
    <h1>Admin sign in.</h1>
    <p class="sub">Authorized Belvo Operations Team only.</p>

    {% if error %}
    <div class="err">{{ error }}</div>
    {% endif %}

    <form action="/admin/login" method="POST">
      <label for="username">Email</label>
      <input id="username" type="email" name="username" required autocomplete="username" autofocus>

      <label for="password">Password</label>
      <input id="password" type="password" name="password" required autocomplete="current-password">

      <button type="submit">Sign in to Admin →</button>
    </form>

    <a class="back" href="/">← Back to public site</a>
  </div>
</body>
</html>
