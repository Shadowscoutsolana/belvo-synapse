<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Belvo Synapse</title>
  <meta name="robots" content="noindex, nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-stone-100 flex items-center justify-center min-h-screen px-4">
  <div class="max-w-md w-full bg-white rounded-3xl p-8 border border-stone-200 shadow-xl">
    <div class="text-center mb-8">
      <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-red-900 to-red-800 flex items-center justify-center text-white font-bold text-xl mx-auto shadow-md mb-3">
        ⚡
      </div>
      <h1 class="text-2xl font-bold text-stone-900">Belvo Synapse Control</h1>
      <p class="text-xs text-stone-500 mt-1">Authorized Belvo Operations Team Only</p>
    </div>

    {% if error %}
    <div class="mb-4 p-3 bg-red-50 border border-red-200 rounded-xl text-red-700 text-xs font-semibold">
      {{ error }}
    </div>
    {% endif %}

    <form action="/admin/login" method="POST" class="space-y-4">
      <div>
        <label class="block text-xs font-bold uppercase text-stone-700 mb-1">Email</label>
        <input type="email" name="username" required value="admin@belvoventures.com" class="w-full px-4 py-2.5 rounded-xl border border-stone-300 text-sm focus:ring-2 focus:ring-red-800 outline-none">
      </div>

      <div>
        <label class="block text-xs font-bold uppercase text-stone-700 mb-1">Password</label>
        <input type="password" name="password" required value="BelvoAdmin2026!" class="w-full px-4 py-2.5 rounded-xl border border-stone-300 text-sm focus:ring-2 focus:ring-red-800 outline-none">
      </div>

      <button type="submit" class="w-full py-3 bg-red-900 hover:bg-red-950 text-white font-bold rounded-xl text-sm transition shadow-md">
        Sign In to Admin
      </button>
    </form>

    <div class="mt-6 pt-6 border-t border-stone-100 text-center text-xs text-stone-400">
      Default Seed Account: admin@belvoventures.com / BelvoAdmin2026!
    </div>
  </div>
</body>
</html>
